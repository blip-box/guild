# Lint and test on every pull request and on pushes to main, and fail while
# a scheduled workflow is disabled.
# Branch protection on main requires only the "required" job, so the matrix
# can change without editing repository settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Runs ruff, mypy, zizmor, actionlint, uv-lock and the file hygiene hooks.
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest

  scheduled:
    name: scheduled
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the state of the scheduled workflows
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for name in canary.yml; do
            state=$(gh api "repos/$GH_REPO/actions/workflows" --jq ".workflows[] | select(.path == \".github/workflows/$name\") | .state")
            # Empty until the workflow first reaches the default branch.
            if [ -n "$state" ] && [ "$state" != "active" ]; then
              echo "::error::$name is $state. Re-enable it: gh workflow enable $name"
              exit 1
            fi
          done

  required:
    name: required
    if: always()
    needs: [lint, test, scheduled]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
