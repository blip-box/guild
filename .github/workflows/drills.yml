# Run a suite of drills against confusable and score it. Started by hand.
#
# Drills gate every change to a pinned part of the harness: a model, the
# Agent SDK and Claude Code versions, an effort level, a role prompt. The
# triage suite costs cents; a build drill can cost its cap per trial, so
# the trial count is an input and defaults to one.
#
# Needs the model credential as the adopters' workflows do: the federation
# variables (ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
# ANTHROPIC_SERVICE_ACCOUNT_ID) or, until then, the secret ANTHROPIC_API_KEY.
name: Drills

on:
  workflow_dispatch:
    inputs:
      suite:
        description: The suite to run
        type: choice
        # sandbox is M0 spike 1 (spikes/README.md): a probe of the Bash
        # sandbox, not a drill suite; trials, cutoff and only are ignored.
        # handoff is a probe too (spikes/handoff_probe.py): one build trial
        # that keeps its session files, or, with resume_run, that session
        # resumed on this runner. only names the drill.
        options: [triage, review, build, sandbox, handoff]
        default: triage
      trials:
        description: Trials per drill (pass^k needs several)
        type: number
        default: 1
      cutoff:
        description: The fresh bucket starts at this date (the model's cutoff)
        type: string
        default: "2026-06-01"
      only:
        description: One drill name, or empty for the whole suite
        type: string
        default: ""
      caller:
        description: The triage caller (triage suite only; the agent suites use the SDK)
        type: choice
        options: [anthropic, typesafe, openai]
        default: anthropic
      triage_model:
        description: The triage model, or empty for the adopter's (triage suite only)
        type: string
        default: ""
      arm:
        description: The build arm (build suite only; cloud grades branches a cloud session pushed)
        type: choice
        options: [sdk, cloud]
        default: sdk
      scratch:
        description: The cloud arm's scratch repository
        type: string
        default: "https://github.com/blip-box/drill-confusable.git"
      resume_run:
        description: The handoff run whose session to resume, or empty to start one
        type: string
        default: ""
      federation_rule:
        # The repository's rule is pinned to refs/heads/main (docs/adopting.md
        # step 3), so a run from another branch needs a rule of its own,
        # pinned to that branch; a rule ID is not a secret.
        description: A federation rule for a run off main, or empty for the repository's
        type: string
        default: ""

permissions: {}

concurrency:
  group: drills-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  drills:
    name: ${{ inputs.suite }}
    if: inputs.suite != 'sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read # the handoff probe downloads an earlier run's artifact
      contents: read # this repository and the public adopter
      id-token: write # workload identity federation for the model credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blip-box/confusable
          path: source
          fetch-depth: 0 # the drills name base commits in the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --extra agents
      - name: Sandbox dependencies
        # The Bash sandbox (agents.SANDBOX) is bubblewrap on Linux and needs
        # socat for its proxy. Ubuntu 24.04 and later restrict unprivileged
        # user namespaces twice: a sysctl strips the capabilities of a
        # namespace an unconfined program creates, and the AppArmor profile
        # bwrap-userns-restrict confines bubblewrap's children the same way,
        # whatever the sysctl says. The sandbox's seccomp helper needs a
        # namespace of its own inside bubblewrap's, so both are lifted: the
        # sysctl, and the profile Claude Code's sandboxing page documents in
        # place of the stock one. The last line fails the job if a nested
        # namespace still does not work; without it the run would end
        # instead of running commands unsandboxed.
        run: |
          # The runner's package mirror sometimes fails to resolve; retry.
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat; then
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep 20
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
            sudo mkdir -p /etc/apparmor.d/disable
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
          fi
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-all --dev-bind / / -- unshare -Ur true
      - name: Identity token
        if: inputs.federation_rule != '' || vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          # GitHub's token lives about five minutes, so a refresher keeps the
          # file fresh for a long run; the harness also fetches a new one
          # before each agent run (agents.refresh_identity_token).
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$RUNNER_TEMP/identity-token.new" \
              && mv -f "$RUNNER_TEMP/identity-token.new" "$RUNNER_TEMP/identity-token"
          }
          fetch
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/identity-token" >> "$GITHUB_ENV"
          export -f fetch
          nohup bash -c 'while sleep 120; do fetch; done' >/dev/null 2>&1 &
      - name: Run
        if: inputs.suite != 'handoff'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule || vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ inputs.federation_rule == '' && vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
          SUITE: ${{ inputs.suite }}
          TRIALS: ${{ inputs.trials }}
          ONLY: ${{ inputs.only }}
          CALLER: ${{ inputs.caller }}
          TRIAGE_MODEL: ${{ inputs.triage_model }}
          ARM: ${{ inputs.arm }}
          SCRATCH: ${{ inputs.scratch }}
          # Each System One key reaches the job only for its own caller.
          TYPESAFE_API_KEY: ${{ inputs.caller == 'typesafe' && secrets.TYPESAFE_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.caller == 'openai' && secrets.OPENAI_API_KEY || '' }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          [ -n "$TYPESAFE_API_KEY" ] || unset TYPESAFE_API_KEY
          [ -n "$OPENAI_API_KEY" ] || unset OPENAI_API_KEY
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          only=()
          [ -z "$ONLY" ] || only=(--only "$ONLY")
          triage_model=()
          [ -z "$TRIAGE_MODEL" ] || triage_model=(--triage-model "$TRIAGE_MODEL")
          uv run --no-sync guildkit drill-run \
            --dir drills/confusable \
            --suite "$SUITE" \
            --config source/guild.toml \
            --roles roles \
            --trials "$TRIALS" \
            --source "$PWD/source" \
            --work "$RUNNER_TEMP/work" \
            --out "$RUNNER_TEMP/out/trials.jsonl" \
            --caller "$CALLER" \
            --models drills/models.toml \
            --arm "$ARM" \
            --scratch "$SCRATCH" \
            "${triage_model[@]}" \
            "${only[@]}" || true
      - name: Score
        if: inputs.suite != 'handoff'
        env:
          SUITE: ${{ inputs.suite }}
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          {
            echo "## Drills: $SUITE"
            echo
            uv run --no-sync guildkit drill-score \
              --results "$RUNNER_TEMP/out/trials.jsonl" \
              --suite "$SUITE" \
              --cutoff "$CUTOFF" \
              --out "$RUNNER_TEMP/out/score.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with the baseline
        # A committed baseline for the suite, when one exists: the last
        # accepted score. A drop beyond the noise fails the run.
        if: inputs.suite != 'handoff'
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          baseline="drills/confusable/baseline-$SUITE.json"
          if [ -f "$baseline" ]; then
            {
              echo
              echo "### Against the baseline"
              echo
              echo '```json'
              uv run --no-sync guildkit drill-compare --baseline "$baseline" --candidate "$RUNNER_TEMP/out/score.json" || echo "DROP"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            uv run --no-sync guildkit drill-compare --baseline "$baseline" --candidate "$RUNNER_TEMP/out/score.json" >/dev/null
          else
            echo "no baseline for $SUITE yet; commit the score as $baseline to set one"
          fi
      - name: The session to resume
        if: inputs.suite == 'handoff' && inputs.resume_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drills-handoff-${{ inputs.resume_run }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/in
      - name: Hand-off probe
        # The work directory has the same path on every hosted runner, so
        # the session files, which the SDK keeps by working directory, land
        # where the resumed run looks for them.
        if: inputs.suite == 'handoff'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule || vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ inputs.federation_rule == '' && vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
          ONLY: ${{ inputs.only }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          phase=first
          from=()
          if [ -n "$RESUME_RUN" ]; then
            phase=resume
            # Wherever the artifact's root put it.
            state=$(find "$RUNNER_TEMP/in" -name first.json | head -n 1)
            from=(--in "$(dirname "$state")")
          fi
          status=0
          uv run --no-sync python spikes/handoff_probe.py "$phase" \
            --dir drills/confusable \
            --drill "${ONLY:-seeded-mark-count}" \
            --config source/guild.toml \
            --roles roles \
            --source "$PWD/source" \
            --work "$RUNNER_TEMP/handoff" \
            --out "$RUNNER_TEMP/out/handoff" \
            "${from[@]}" > "$RUNNER_TEMP/handoff.log" 2>&1 || status=$?
          {
            echo "## Spike: hand-off, $phase"
            echo
            echo '```'
            cat "$RUNNER_TEMP/handoff.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/handoff.log"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drills-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/trials.jsonl
            ${{ runner.temp }}/out/score.json
            ${{ runner.temp }}/out/handoff/**
            ${{ runner.temp }}/work/*.transcript.jsonl
          retention-days: 90

  sandbox:
    # M0 spike 1: does the Bash sandbox start on ubuntu-latest and block
    # egress? One short turn on the triage model, a few cents; the step
    # summary shows the verdict. It lives here because a workflow is only
    # dispatchable once it exists on the default branch, and this one runs
    # from the spike branch. Needs the model credential as the drills do.
    name: sandbox probe
    if: inputs.suite == 'sandbox' && vars.GUILD_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # this repository
      id-token: write # workload identity federation for the model credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --extra agents
      - name: Sandbox dependencies
        # The Bash sandbox (agents.SANDBOX) is bubblewrap on Linux and needs
        # socat for its proxy. Ubuntu 24.04 and later restrict unprivileged
        # user namespaces twice: a sysctl strips the capabilities of a
        # namespace an unconfined program creates, and the AppArmor profile
        # bwrap-userns-restrict confines bubblewrap's children the same way,
        # whatever the sysctl says. The sandbox's seccomp helper needs a
        # namespace of its own inside bubblewrap's, so both are lifted: the
        # sysctl, and the profile Claude Code's sandboxing page documents in
        # place of the stock one. The last line fails the job if a nested
        # namespace still does not work; without it the run would end
        # instead of running commands unsandboxed.
        run: |
          # The runner's package mirror sometimes fails to resolve; retry.
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat; then
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep 20
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
            sudo mkdir -p /etc/apparmor.d/disable
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
          fi
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-all --dev-bind / / -- unshare -Ur true
      - name: Diagnose nested user namespaces
        # A record for the spike (docs/ab-experiment-plan.md, M0 log): the
        # first probe found the sandbox's seccomp helper unable to set up a
        # user namespace inside bubblewrap ("nested userns is
        # capability-restricted"), the stock AppArmor profile's doing. The
        # shared step above lifts it; this step shows the runner's state and
        # gates the model turn on a nested namespace working.
        id: diagnose
        run: |
          set +e
          {
            echo "### Diagnosis"
            echo '```'
            echo "image: $ImageOS $ImageVersion"
            bwrap --version
            sysctl kernel.apparmor_restrict_unprivileged_userns \
              kernel.apparmor_restrict_unprivileged_unconfined 2>&1
            echo "apparmor.d:"; ls /etc/apparmor.d | grep -i -E 'bwrap|userns|unshare' | sed 's/^/  /'
            echo "loaded profiles:"; sudo aa-status 2>/dev/null | grep -i -E 'bwrap|userns' | sed 's/^/  /'
            unshare -Ur true 2>&1 && echo "plain userns: ok" || echo "plain userns: FAIL"
            bwrap --unshare-all --dev-bind / / -- unshare -Ur true 2>&1 \
              && echo "nested userns inside bwrap: ok" \
              || echo "nested userns inside bwrap: FAIL"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if bwrap --unshare-all --dev-bind / / -- unshare -Ur true >/dev/null 2>&1; then
            echo "nested_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "nested_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Identity token
        if: steps.diagnose.outputs.nested_ok == 'true' && (inputs.federation_rule != '' || vars.ANTHROPIC_FEDERATION_RULE_ID != '')
        run: |
          # GitHub's token lives about five minutes, so a refresher keeps the
          # file fresh for a long run; the harness also fetches a new one
          # before each agent run (agents.refresh_identity_token).
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$RUNNER_TEMP/identity-token.new" \
              && mv -f "$RUNNER_TEMP/identity-token.new" "$RUNNER_TEMP/identity-token"
          }
          fetch
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/identity-token" >> "$GITHUB_ENV"
          export -f fetch
          nohup bash -c 'while sleep 120; do fetch; done' >/dev/null 2>&1 &
      - name: Nested user namespaces unavailable
        if: steps.diagnose.outputs.nested_ok != 'true'
        run: |
          echo "the sandbox cannot run commands on this runner; see the diagnosis"
          exit 1
      - name: Probe
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule || vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ inputs.federation_rule == '' && vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          status=0
          uv run --no-sync python spikes/sandbox_probe.py > "$RUNNER_TEMP/probe.log" || status=$?
          uv run --no-sync python spikes/subagent_probe.py > "$RUNNER_TEMP/subagent.log" || status=$?
          {
            echo "## Spike: sandbox"
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe.log"
            echo '```'
            echo
            echo "## M2: subagents, skill, gate"
            echo
            echo '```'
            cat "$RUNNER_TEMP/subagent.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/probe.log" "$RUNNER_TEMP/subagent.log"
          exit "$status"
