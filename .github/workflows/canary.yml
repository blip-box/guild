# Weekly: a few drills at one trial against the pinned models, SDK, CLI and
# role prompts, so drift between deliberate changes (a model retired, an API
# or CLI change, a prompt that stopped working, an adopter commit that moved)
# is noticed within a week. A failed run opens or comments on an issue, and
# CI fails while this workflow is disabled, so it cannot stop working
# unnoticed.
#
# Needs the model credential as the Drills workflow does. Until the
# credential is set, every run fails and the issue says so; set the variable
# GUILD_PAUSED to true to pause it.
name: Canary

on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays, 05:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    name: ${{ matrix.suite }}
    if: vars.GUILD_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read # this repository and the public adopter
      id-token: write # workload identity federation for the model credential
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three cheap triage drills, the seeded review drill and the seeded
          # build drill: five drills, one trial each, as docs/plan.md says.
          - suite: triage
            drills: bug-confirmed-paypal injection-in-a-bug-report spam
          - suite: review
            drills: seeded-bidi-fast-path
          - suite: build
            drills: seeded-bidi-fast-path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blip-box/confusable
          path: source
          fetch-depth: 0 # the drills name base commits in the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --extra agents
      - name: Sandbox dependencies
        # The Bash sandbox (agents.SANDBOX) is bubblewrap on Linux and needs
        # socat for its proxy. Ubuntu 24.04 and later restrict unprivileged
        # user namespaces twice: a sysctl strips the capabilities of a
        # namespace an unconfined program creates, and the AppArmor profile
        # bwrap-userns-restrict confines bubblewrap's children the same way,
        # whatever the sysctl says. The sandbox's seccomp helper needs a
        # namespace of its own inside bubblewrap's, so both are lifted: the
        # sysctl, and the profile Claude Code's sandboxing page documents in
        # place of the stock one. The last line fails the job if a nested
        # namespace still does not work; without it the run would end
        # instead of running commands unsandboxed.
        run: |
          # The runner's package mirror sometimes fails to resolve; retry.
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat; then
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep 20
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
            sudo mkdir -p /etc/apparmor.d/disable
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
          fi
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-all --dev-bind / / -- unshare -Ur true
      - name: Identity token
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          # GitHub's token lives about five minutes, so a refresher keeps the
          # file fresh for a long run; the harness also fetches a new one
          # before each agent run (agents.refresh_identity_token).
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$RUNNER_TEMP/identity-token.new" \
              && mv -f "$RUNNER_TEMP/identity-token.new" "$RUNNER_TEMP/identity-token"
          }
          fetch
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/identity-token" >> "$GITHUB_ENV"
          export -f fetch
          nohup bash -c 'while sleep 120; do fetch; done' >/dev/null 2>&1 &
      - name: Run
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
          SUITE: ${{ matrix.suite }}
          DRILLS: ${{ matrix.drills }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] || unset ANTHROPIC_WORKSPACE_ID
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          read -ra names <<< "$DRILLS"
          only=()
          for name in "${names[@]}"; do only+=(--only "$name"); done
          status=0
          uv run --no-sync guildkit drill-run \
            --dir drills/confusable \
            --suite "$SUITE" \
            --config source/guild.toml \
            --roles roles \
            --trials 1 \
            --source "$PWD/source" \
            --work "$RUNNER_TEMP/work" \
            --out "$RUNNER_TEMP/out/trials.jsonl" \
            "${only[@]}" > "$RUNNER_TEMP/out/run.log" || status=$?
          # The lines are the runner's own: drill names, pass or FAIL and, for
          # a failed triage drill, the enumerations the model chose.
          {
            echo "## Canary: $SUITE"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/out/run.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/trials.jsonl
            ${{ runner.temp }}/out/run.log
            ${{ runner.temp }}/work/*.transcript.jsonl
          retention-days: 90

  report:
    name: report
    needs: [canary]
    if: always() && needs.canary.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write # open the failure issue, or comment on it
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.canary.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The weekly canary is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$RESULT" = "success" ]; then
            [ -z "$number" ] || gh issue comment "$number" --body "It passed: $RUN_URL"
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed again: $RUN_URL"
          else
            {
              printf 'The weekly canary failed: %s\n\n' "$RUN_URL"
              printf 'The step summary of each suite names the drills that failed; the artifacts hold the trials with their reasons and the transcripts. '
              printf 'Until it passes, a change to a pinned model, the Agent SDK, a role prompt or the adopter may be breaking Guild unnoticed. docs/operations.md says what to check.\n'
            } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
